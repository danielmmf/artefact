[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "emporio-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10,<3",
    "pypdf>=5,<7",
    "python-dotenv>=1,<2",
    "rapidfuzz>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
lab = ["pyyaml>=6,<7"]

[project.scripts]
emporio = "emporio.cli:main"
emporio-lab = "emporio_lab.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/emporio", "src/emporio_lab"]
